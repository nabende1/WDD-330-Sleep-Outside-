<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Marmot Ajax 3 person tent</title>

    <link rel="stylesheet" href="../css/style.css" />

    <script src="../js/product.js" type="module"></script>
  </head>

  <body>
    <header id="main-header" class="divider"></header>
    <main class="divider">
      <section class="product-detail" id="product-detail">
        <!-- JS will populate this element -->
        <h3 id="productBrand">Brand Name</h3>
        <h2 id="productTitle" class="divider">Product</h2>

        <img
          src="../images/camping-products.jpg"
          alt="Product image"
          id="productImage"
          class="divider"
        />

        <p id="productPrice" class="product-card__price">$000.99</p>
        <p id="productColor" class="product__color">Color</p>
        <p id="productDesc" class="product__description">Description</p>

        <div class="product-detail__add">
          <button id="addToCart" data-id="">Add to Cart</button>
        </div>
      </section>
    </main>
    <footer id="main-footer" class="divider"></footer>
  </body>
</html>
