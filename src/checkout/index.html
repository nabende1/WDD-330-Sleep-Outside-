<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <header id="main-header" class="divider"></header>

    <main class="divider">
      <section class="products">
        <h2>Review & Place your Order</h2>
        <main class="checkout-container">
          <h1>Checkout</h1>

          <section class="checkout-content">
            <form id="checkout-form" name="checkout">
              <h2>Customer Information</h2>

              <label>
                First Name
                <input
                  type="text"
                  name="fname"
                  id="firstName"
                  required
                  value=""
                />
              </label>

              <label>
                Last Name
                <input
                  type="text"
                  name="lname"
                  id="lastName"
                  required
                  value=""
                />
              </label>

              <label>
                Street Address
                <input
                  type="text"
                  name="street"
                  id="street"
                  required
                  value=""
                />
              </label>

              <label>
                City
                <input type="text" name="city" id="city" required value="" />
              </label>

              <label>
                State
                <input type="text" name="state" id="state" required value="" />
              </label>

              <label>
                Zip Code
                <input
                  type="text"
                  name="zip"
                  id="zip"
                  required
                  maxlength="10"
                  value=""
                />
              </label>

              <h2>Payment</h2>

              <label>
                Card Number
                <input
                  type="text"
                  name="cardNumber"
                  id="cardNumber"
                  required
                  maxlength="16"
                  autocomplete="cc-number"
                  value=""
                />
              </label>

              <label>
                Expiration
                <input
                  type="text"
                  name="expiration"
                  id="expiration"
                  placeholder="MM/YY"
                  pattern="(0[1-9]|1[0-2])/[0-9]{2}"
                  maxlength="5"
                  autocomplete="cc-exp"
                  required
                  value=""
                />
              </label>

              <label>
                Security Code
                <input
                  type="text"
                  name="code"
                  id="cvv"
                  required
                  maxlength="3"
                  autocomplete="cc-csc"
                  value=""
                />
              </label>

              <button type="submit" class="checkout-submit">Place Order</button>
            </form>

            <aside id="order-summary" class="checkout-summary">
              <h2>Order Summary</h2>
              <p>Items: <span id="items">0</span></p>
              <p>Subtotal: <span id="subtotal">$0.00</span></p>
              <p>Tax: <span id="tax">$0.00</span></p>
              <p>Shipping: <span id="shipping">$0.00</span></p>
              <hr />
              <h3>Order Total: <span id="order-total">$0.00</span></h3>
            </aside>
          </section>
        </main>
        <script type="module" src="../js/checkout.js"></script>
      </section>
    </main>
    <!-- Dynamic footer placeholder -->
    <footer id="main-footer"></footer>
  </body>
</html>
